version: '3.8'

services:
  cosim-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wowkispice-cosim-runner
    volumes:
      - ./output:/app/output
    environment:
      - SIM_DURATION_MS=10.0
      - SIM_TSTEP_US=0.5
    # Pure-Python mock closed loop (bridge/mock_controller) despite the file
    # name: --mode benchmark never launches an emulator, and the Renode path
    # is abandoned. See docs/legacy-module-audit.md.
    command: python3 bridge/renode_orchestrator.py --mode benchmark --time 10.0 --plot output/waveform.png
