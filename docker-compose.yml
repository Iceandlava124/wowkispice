version: '3.8'

services:
  cosim-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wowkispice-cosim-runner
    volumes:
      - ./output:/app/output
    environment:
      - SIM_DURATION_MS=10.0
      - SIM_TSTEP_US=0.5
    # Pure-Python mock closed loop (bridge/mock_controller). The abandoned
    # Renode wrapper was deleted 2026-10-09; this runs the module directly.
    # See docs/legacy-module-audit.md.
    command: python3 bridge/mock_controller.py --time 10.0 --plot output/waveform.png
