version: '3.8'

services:
  wosp:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - wosp-third-party:/app/third_party
    environment:
      - PYTHONUNBUFFERED=1
      - WOSP_DOCKER=1
    working_dir: /app
    command: .venv/bin/python -m pytest tests/test_adversarial_stress.py tests/test_load_step_injection.py tests/test_binary_runner.py tests/test_qemu_monitor_unit.py -v
  
  wosp-dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - wosp-third-party:/app/third_party
    environment:
      - PYTHONUNBUFFERED=1
      - WOSP_DOCKER=1
    working_dir: /app
    stdin_open: true
    tty: true
    command: /bin/bash
  
  wosp-doctor:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - wosp-third-party:/app/third_party
    environment:
      - PYTHONUNBUFFERED=1
      - WOSP_DOCKER=1
    working_dir: /app
    command: .venv/bin/python tools/doctor.py

volumes:
  wosp-third-party:
