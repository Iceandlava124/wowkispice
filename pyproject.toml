[build-system]
requires = ["setuptools>=68.0", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[project]
name = "wosp"
version = "1.0.0"
description = "WOSP: mixed-signal emulator + ESP32 firmware-in-the-loop reference harness"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "WOSP contributors"}]
keywords = ["esp32", "ngspice", "qemu", "embedded", "co-simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "pypdf>=4.0.0",
    "pytest>=8.0.0",
    "PyQt5>=5.15.0",
    "pyqtgraph>=0.13.0",
    "scipy>=1.11.0",
    "pytest-timeout>=2.3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-timeout>=2.3.0"]
dev = ["pytest>=8.0.0", "pytest-timeout>=2.3.0"]

[project.scripts]
wosp-check = "bridge.selfcheck:main"

[tool.setuptools.packages.find]
include = ["bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
markers = [
    "qemu: real-QEMU contract tests (qemu-system-xtensa required)",
]
