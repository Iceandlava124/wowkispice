name: Rust CI

on:
  push:
    branches: [ main, master, dev, baseline-fix ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-core:
    name: wowkispice-core Unit Tests
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: ./.github/actions/msys2-setup
        with:
          msys2-channel: 'ucrt64'

      - name: Run Rust Core Tests
        shell: bash
        run: cargo test -p wowkispice-core 2>&1 | tee test-output.txt
        timeout-minutes: 60

      - name: Verify Zero Warnings
        shell: bash
        run: |
          # Informational only: warnings are reported, not gated.
          count=$(grep -c "warning" test-output.txt || true)
          echo "warning lines: $count"

      - name: Artifact Test Logs
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-wowkispice-core
          path: test-output.txt
          retention-days: 7
