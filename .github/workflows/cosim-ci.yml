name: Mixed-Signal Hardware-Software Co-Simulation CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  cosim-test-matrix:
    name: Co-Sim Voltage & Load Matrix Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (ngspice)
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice libngspice0 libngspice0-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ngspice Ctypes Bridge Sanity Test
        run: |
          python tests/test_ngspice_bridge.py

      - name: Run Closed-Loop Buck Converter Physics & Regulation Test
        run: |
          python tests/test_closed_loop_buck.py

      - name: Run the full test suite
        run: |
          python tools/run_tests.py

      # Not an emulator run, despite living in a file named renode_orchestrator.
      # `--mode benchmark` branches straight to bridge/mock_controller, a
      # pure-Python closed loop. Kept because it is a real check of that
      # module, relabelled so it stops implying Renode coverage.
      #
      # The Renode emulator path itself is ABANDONED, not merely untested:
      # Renode cannot decode the Xtensa `entry` instruction, which appears 393
      # times in an ESP-IDF build, so it executed zero instructions of this
      # firmware. The emulator target is Espressif QEMU now
      # (bridge/qemu_orchestrator.py). See docs/legacy-module-audit.md.
      - name: Run legacy Python mock closed-loop harness (no emulator)
        run: |
          python bridge/renode_orchestrator.py --mode benchmark --time 10.0 --plot tests/ci_waveform.png

      - name: Upload Simulation Waveforms Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-waveforms
          path: tests/*.png
          retention-days: 7
