  generate-sbom:
    name: Generate SBOM (best-effort)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true   # SBOM is informational; never block the pipeline on it

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install system libraries for lxml
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev

      - name: Install cyclonedx tooling
        shell: bash
        run: |
          set -o pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install --user cyclonedx-bom lxml
          # cyclonedx-bom v5+ renamed its CLI from `cyclonedx-bom` to `cyclonedx-py`,
          # and pip --user scripts land in ~/.local/bin (not on PATH by default).
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate SBOM
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p SBOMs
          # Correct modern CLI: `cyclonedx-py environment`. The old
          # `cyclonedx-bom -p ... --parsers ...` flags no longer exist.
          if command -v cyclonedx-py >/dev/null 2>&1; then
            cyclonedx-py environment --of JSON -o SBOMs/cyclonedx-bom.json 2>&1 | tee sbom_gen.log
          else
            echo "cyclonedx-py not on PATH after install - SBOM skipped" | tee sbom_gen.log
          fi
          {
            echo "=== SBOM generation status ==="
            echo "cyclonedx-py: $(command -v cyclonedx-py 2>/dev/null || echo NOT_FOUND)"
            cat sbom_gen.log
            echo "=== Output file ==="
            if [ -f SBOMs/cyclonedx-bom.json ]; then
              echo "SBOM generated: $(wc -c < SBOMs/cyclonedx-bom.json) bytes"
            else
              echo "SBOM NOT generated (best-effort job; pipeline not blocked)"
            fi
          } > sbom_status.txt
          cat sbom_status.txt

      - name: Upload SBOM Artifact (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cyclonedx-sbom
          path: |
            SBOMs/cyclonedx-bom.json
            sbom_status.txt
          retention-days: 14

  verify-installer-selfcheck:
    name: Verify Installer Self-Check
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Self-Check Batch
        shell: cmd
        run: cmd /c installer\tools\run_selfcheck.bat
        working-directory: .
