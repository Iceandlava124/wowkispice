name: Julia CI

on:
  push:
    branches: [ main, master, dev, baseline-fix ]
  pull_request:
    branches: [ main, master ]

# Every job uses bash (Git Bash ships with all GitHub-hosted runners),
# so the same script works on Windows, Linux and macOS.
# Steps print the failing test names instead of just "SOME TESTS FAILED".

jobs:
  test-julia-windows:
    name: wowkispice-core Julia Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set native Rust target
        shell: bash
        run: |
          # The repo's .cargo/config.toml pins x86_64-pc-windows-gnu for local
          # Windows dev (no MSVC linker). CI runners must use their own host
          # target, otherwise Linux/macOS fail with E0463 (no gnu std).
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          echo "CARGO_BUILD_TARGET=$HOST" >> "$GITHUB_ENV"
          echo "Using native Rust target: $HOST"

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - name: Cache Julia depot
        uses: actions/cache@v4
        with:
          path: |
            ~/.julia/artifacts
            ~/.julia/packages
            ~/.julia/compiled
          key: ${{ runner.os }}-julia-depot-${{ hashFiles('bridge/julia/Manifest.toml') }}

      - name: Instantiate Julia environment (from lockfile)
        shell: bash
        run: julia --project=bridge/julia -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
        timeout-minutes: 30

      - name: Run Rust Tests with Julia Feature
        shell: bash
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test -p wowkispice-core --features julia 2>&1 | tee julia_test_log.txt
          echo "cargo_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Report Failed Tests (Windows)
        shell: bash
        if: steps.tests.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "FAILED TESTS on Windows (from julia_test_log.txt):"
          echo "=========================================="
          grep -E "FAILED|failures:|test result: FAILED" julia_test_log.txt || true
          echo ""
          echo "--- Last 40 lines of log ---"
          tail -40 julia_test_log.txt || true
          exit 1

      - name: Summarize Result (Windows)
        shell: bash
        if: always()
        run: |
          {
            echo "=== WOWKISPICE Julia CI - Windows ==="
            echo "Run date: $(date -u)"
            grep -E "test result:" julia_test_log.txt || true
            echo ""
            if grep -qE "test result: FAILED|failures:|\[failed\]|error\[" julia_test_log.txt; then
              echo "RESULT: FAILED - see julia-ci-logs-windows artifact and 'Report Failed Tests' step"
            else
              echo "RESULT: PASSED"
            fi
          } | tee summary_windows.txt

      - name: Upload Test Logs (always, even on failure)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: julia-test-logs-windows
          path: |
            julia_test_log.txt
            summary_windows.txt
          retention-days: 14

      - name: Julia Solver Validation
        shell: bash
        run: |
          set -o pipefail
          julia --project=bridge/julia bridge/julia/solve_julia.jl \
            '{"circuit":{"type":"rc"},"simulation":{"dt":1e-6,"tstop":0.01}}' \
            > solver_output.txt 2>&1 || {
              echo "SOLVER FAILED to run" | tee solver_summary.txt
              cat solver_output.txt >> solver_summary.txt
              exit 1
            }
          if ! grep -q '"status"' solver_output.txt || ! grep -q '"times"' solver_output.txt; then
            {
              echo "SOLVER OUTPUT INVALID - missing required fields (status/times)"
              echo "--- solver_output.txt ---"
              cat solver_output.txt
            } | tee solver_summary.txt
            exit 1
          fi
          echo "SOLVER PASSED" | tee solver_summary.txt
          cat solver_output.txt >> solver_summary.txt

      - name: Julia Parameter Tests (custom component values)
        shell: bash
        run: julia --project=bridge/julia bridge/julia/test_parameters.jl

      - name: Validation Corpus (closed-form physics)
        shell: bash
        run: julia --project=bridge/julia bridge/julia/validation_corpus.jl

      - name: Stiff Circuit Test (auto vs explicit solver)
        shell: bash
        run: julia --project=bridge/julia bridge/julia/test_stiff.jl

      - name: Golden Trace Sign-off
        shell: bash
        run: julia --project=bridge/julia bridge/julia/golden_signoff.jl

      - name: Input Validation (robustness)
        shell: bash
        run: julia --project=bridge/julia bridge/julia/test_validation.jl

      - name: CLI end-to-end (custom RL simulation)
        shell: bash
        run: |
          set -o pipefail
          cargo run -q -p wosp-cli -- sim rl --r 50 --l 0.01 --vin 12 --tstop 0.02 > cli_out.txt
          cat cli_out.txt
          grep -q '"status":"success"' cli_out.txt
          # final_vout is 0.24 A (12V/50ohm); emitted in scientific notation.
          # Accept both 2.399999e-1 (tsit5) and 2.400000e-1 (auto method).
          grep -qE '2\.(39|40)' cli_out.txt

      - name: Upload Solver Logs (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: julia-solver-logs-windows
          path: solver_summary.txt
          retention-days: 14

