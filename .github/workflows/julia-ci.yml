name: Julia CI

on:
  push:
    branches: [ main, master, dev, baseline-fix ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-julia-windows:
    name: wowkispice-core Julia Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - name: Install Julia dependencies
        run: julia -e 'using Pkg; Pkg.add(["DifferentialEquations", "JSON"])'
        timeout-minutes: 30

      - name: Run Rust Tests with Julia Feature
        name: cargo test --features julia
        run: |
          cargo test -p wowkispice-core --features julia 2>&1 | tee julia_test_log.txt
          echo "=== TEST SUMMARY ===" > summary_windows.txt
          ok_count=$(findstr /c:"test result: ok" julia_test_log.txt | find /c /v "failed")
          echo "OK: %ok_count%" >> summary_windows.txt
          if %ok_count% NEQ 0 (
            echo "ALL TESTS PASSED" >> summary_windows.txt
          ) else (
            echo "SOME TESTS FAILED - see julia_test_log.txt for details" >> summary_windows.txt
          )

      - name: Upload Test Logs
        uses: actions/upload-artifact@v4
        with:
          name: julia-test-logs-windows
          path: |
            julia_test_log.txt
            summary_windows.txt

      - name: Julia Solver Validation
        run: |
          cd bridge/julia
          julia solve_julia.jl "{\"circuit\":{\"type\":\"rc\"},\"simulation\":{\"dt\":1e-6,\"tstop\":0.01}}" > solver_output.txt 2>&1
          echo "Solver exit code: %errorlevel%" > solver_summary.txt
          type solver_output.txt >> solver_summary.txt
          if %errorlevel% NEQ 0 (
            echo "SOLVER FAILED - details above" >> solver_summary.txt
          ) else (
            echo "SOLVER PASSED" >> solver_summary.txt
          )
        working-directory: .

  test-julia-linux:
    name: wowkispice-core Julia Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - name: Install Julia dependencies
        run: julia -e 'using Pkg; Pkg.add(["DifferentialEquations", "JSON"])'
        timeout-minutes: 30

      - name: Run Rust Tests with Julia Feature
        name: cargo test --features julia
        run: |
          cargo test -p wowkispice-core --features julia 2>&1 | tee julia_test_log.txt
          echo "=== TEST SUMMARY ===" > summary_linux.txt
          ok_count=$(grep -c "test result: ok" julia_test_log.txt)
          echo "OK: $ok_count" >> summary_linux.txt
          if [ "$ok_count" -ge 342 ]; then
            echo "ALL TESTS PASSED" >> summary_linux.txt
          else
            echo "SOME TESTS FAILED - see julia_test_log.txt for details" >> summary_linux.txt
          fi

      - name: Upload Test Logs
        uses: actions/upload-artifact@v4
        with:
          name: julia-test-logs-linux
          path: |
            julia_test_log.txt
            summary_linux.txt

      - name: Julia Solver Validation
        run: |
          cd bridge/julia
          julia solve_julia.jl "{\"circuit\":{\"type\":\"rc\"},\"simulation\":{\"dt\":1e-6,\"tstop\":0.01}}" > solver_output.txt 2>&1 || true
          echo "Solver exit code: $?" > solver_summary.txt
          cat solver_output.txt >> solver_summary.txt
          if [ "$?" -ne 0 ]; then
            echo "SOLVER FAILED - details above" >> solver_summary.txt
          else
            echo "SOLVER PASSED" >> solver_summary.txt
          fi
        working-directory: .

  test-julia-macos:
    name: wowkispice-core Julia Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - name: Install Julia dependencies
        run: julia -e 'using Pkg; Pkg.add(["DifferentialEquations", "JSON"])'
        timeout-minutes: 30

      - name: Run Rust Tests with Julia Feature
        name: cargo test --features julia
        run: |
          cargo test -p wowkispice-core --features julia 2>&1 | tee julia_test_log.txt
          echo "=== TEST SUMMARY ===" > summary_macos.txt
          ok_count=$(grep -c "test result: ok" julia_test_log.txt)
          echo "OK: $ok_count" >> summary_macos.txt
          if [ "$ok_count" -ge 342 ]; then
            echo "ALL TESTS PASSED" >> summary_macos.txt
          else
            echo "SOME TESTS FAILED - see julia_test_log.txt for details" >> summary_macos.txt
          fi

      - name: Upload Test Logs
        uses: actions/upload-artifact@v4
        with:
          name: julia-test-logs-macos
          path: |
            julia_test_log.txt
            summary_macos.txt

      - name: Julia Solver Validation
        run: |
          cd bridge/julia
          julia solve_julia.jl "{\"circuit\":{\"type\":\"rc\"},\"simulation\":{\"dt\":1e-6,\"tstop\":0.01}}" > solver_output.txt 2>&1 || true
          echo "Solver exit code: $?" > solver_summary.txt
          cat solver_output.txt >> solver_summary.txt
          if [ "$?" -ne 0 ]; then
            echo "SOLVER FAILED - details above" >> solver_summary.txt
          else
            echo "SOLVER PASSED" >> solver_summary.txt
          fi
        working-directory: .

  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install cyclonedx dependencies
        run: |
          python3 -m pip install cython lxml > pip_install.log 2>&1 || true
          pip_exit=$?
          if [ "$pip_exit" -ne 0 ]; then
            echo "PIP INSTALL FAILED - see pip_install.log" > install_error.txt
          fi

      - name: Generate SBOM
        run: |
          if [ -f pip_install.log ] && grep -q "FAILED" pip_install.log; then
            echo "SKIPPED: cyclonedx-bom generation failed during pip install" > SBOMs/cyclonedx-bom.json
          else
            cyclonedx-bom -j -o SBOMs/cyclonedx-bom.json \
              -p crates/wowkispice-core \
              -p bridge/julia \
              --parsers rust,cpp,python
          fi

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: SBOMs/cyclonedx-bom.json

  verify-installer-selfcheck:
    name: Verify Installer Self-Check
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Self-Check Batch
        run: cmd /c installer\tools\run_selfcheck.bat
        working-directory: .