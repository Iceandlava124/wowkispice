  generate-sbom:
    name: Generate SBOM (best-effort)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true   # SBOM is informational; never block the pipeline on it

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install system libraries for lxml
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev

      - name: Install cyclonedx tooling
        shell: bash
        run: |
          set -o pipefail
          python3 -m pip install --upgrade pip 2>&1 | tee pip_install.log
          python3 -m pip install cyclonedx-bom lxml 2>&1 | tee -a pip_install.log

      - name: Generate SBOM
        shell: bash
        run: |
          set -o pipefail
          mkdir -p SBOMs
          cyclonedx-bom -o SBOMs/cyclonedx-bom.json \
            -p crates/wowkispice-core \
            -p bridge/julia \
            --parsers rust,cpp,python 2>&1 | tee sbom_gen.log
          echo "SBOM generation exit: $?" | tee sbom_status.txt
          cat sbom_gen.log >> sbom_status.txt

      - name: Upload SBOM Artifact (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cyclonedx-sbom
          path: |
            SBOMs/cyclonedx-bom.json
            sbom_status.txt
          retention-days: 14

  verify-installer-selfcheck:
    name: Verify Installer Self-Check
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Self-Check Batch
        shell: cmd
        run: cmd /c installer\tools\run_selfcheck.bat
        working-directory: .
