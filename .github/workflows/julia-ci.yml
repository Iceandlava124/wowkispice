name: Julia CI

on:
  push:
    branches: [ main, master, dev, baseline-fix ]
  pull_request:
    branches: [ main, master ]

# Every job uses bash (Git Bash ships with all GitHub-hosted runners),
# so the same script works on Windows, Linux and macOS.
# Steps print the failing test names instead of just "SOME TESTS FAILED".

jobs:
  test-julia-windows:
    name: wowkispice-core Julia Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - name: Install Julia dependencies
        shell: bash
        run: julia -e 'using Pkg; Pkg.add(["DifferentialEquations", "JSON"])'
        timeout-minutes: 30

      - name: Run Rust Tests with Julia Feature
        shell: bash
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test -p wowkispice-core --features julia 2>&1 | tee julia_test_log.txt
          echo "cargo_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Report Failed Tests (Windows)
        shell: bash
        if: steps.tests.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "FAILED TESTS on Windows (from julia_test_log.txt):"
          echo "=========================================="
          grep -E "FAILED|failures:|test result: FAILED" julia_test_log.txt || true
          echo ""
          echo "--- Last 40 lines of log ---"
          tail -40 julia_test_log.txt || true
          exit 1

      - name: Summarize Result (Windows)
        shell: bash
        if: always()
        run: |
          {
            echo "=== WOWKISPICE Julia CI - Windows ==="
            echo "Run date: $(date -u)"
            grep -E "test result:" julia_test_log.txt || true
            echo ""
            if grep -qE "test result: FAILED|failures:|\[failed\]|error\[" julia_test_log.txt; then
              echo "RESULT: FAILED - see julia-ci-logs-windows artifact and 'Report Failed Tests' step"
            else
              echo "RESULT: PASSED"
            fi
          } | tee summary_windows.txt

      - name: Upload Test Logs (always, even on failure)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: julia-test-logs-windows
          path: |
            julia_test_log.txt
            summary_windows.txt
          retention-days: 14

      - name: Julia Solver Validation
        shell: bash
        run: |
          set -o pipefail
          julia bridge/julia/solve_julia.jl \
            '{"circuit":{"type":"rc"},"simulation":{"dt":1e-6,"tstop":0.01}}' \
            > solver_output.txt 2>&1 || {
              echo "SOLVER FAILED to run" | tee solver_summary.txt
              cat solver_output.txt >> solver_summary.txt
              exit 1
            }
          if ! grep -q '"status"' solver_output.txt || ! grep -q '"times"' solver_output.txt; then
            {
              echo "SOLVER OUTPUT INVALID - missing required fields (status/times)"
              echo "--- solver_output.txt ---"
              cat solver_output.txt
            } | tee solver_summary.txt
            exit 1
          fi
          echo "SOLVER PASSED" | tee solver_summary.txt
          cat solver_output.txt >> solver_summary.txt

      - name: Upload Solver Logs (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: julia-solver-logs-windows
          path: solver_summary.txt
          retention-days: 14

