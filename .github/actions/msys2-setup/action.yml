name: MSYS2 UCRT64 Setup
description: 'Configures MSYS2 environment variables for Rust builds'
inputs:
  msys2-channel:
    description: 'MSYS2 channel (default: ucrt64)'
    default: 'ucrt64'
    required: false
outputs:
  msys2-dir:
    description: 'Path to MSYS2 bin directory'
    value: ${{ steps.setup.outputs.msys2-dir }}
runs:
  using: 'composite'
  steps:
    - name: Install MSYS2 UCRT64 tools
      id: setup
      shell: bash
      run: |
        echo "Setting up MSYS2 ${INPUTS_MSYS2_CHANNEL} environment"
        # Windows-latest runner already has gcc, cmake, ninja on PATH.
        # Just surface the channel and export the bin dir for later steps.
        BIN_DIR="/usr/${INPUTS_MSYS2_CHANNEL}/bin"
        echo "msys2-dir=$BIN_DIR" >> "$GITHUB_OUTPUT"
        echo "$BIN_DIR" >> "$GITHUB_PATH"
    - name: Verify Build Tools
      shell: bash
      run: |
        echo "Checking build tools..."
        gcc --version || echo "gcc not found"
        cmake --version || echo "cmake not found"
        ninja --version || echo "ninja not found"
