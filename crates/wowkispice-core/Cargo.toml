[package]
name = "wowkispice-core"
version.workspace = true
edition.workspace = true
license.workspace = true

# The core is policy and math: it must build with no dependencies, the way
# the Python original depends only on the stdlib.  A dependency here would
# become a dependency of every firmware target that links it.
#
# Optional Julia feature: when enabled, the Rust code can invoke the Julia
# circuit solver (julia solve_julia.jl) for circuit solving.  This is opt-in
# to maintain the zero-dependency baseline.
[features]
default = []
julia = []

[lib]
crate-type = ["rlib", "cdylib"]